name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      finalize_only:
        description: Reuse uploaded builds and finish updater and Homebrew metadata
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  # Update version in repo before building
  update-version:
    if: ${{ !inputs.finalize_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Update version if release starts with 'v'
        shell: bash
        run: |
          TAG_NAME="${{ env.RELEASE_TAG }}"
          echo "Release tag: $TAG_NAME"

          if [[ "$TAG_NAME" =~ ^v ]]; then
            VERSION="${TAG_NAME:1}"
            echo "Updating version to: $VERSION"

            # Update package.json
            pnpm version --no-git-tag-version "$VERSION"

            # Update tauri.conf.json
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json

            # Update Cargo.toml
            sed -i "s/^version = .*/version = \"$VERSION\"/" src-tauri/Cargo.toml

            # Update Cargo.lock to reflect new version
            cd src-tauri && cargo update --workspace && cd ..

            # Commit and push
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
            git commit -m "chore: bump version to $VERSION"
            git push
          fi

  # Build GUI app with Tauri (unsigned)
  build:
    needs: update-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            arch: 'aarch64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            arch: 'x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish || 'main' }}

      - name: Pull latest (includes version bump)
        run: git pull origin ${{ github.event.release.target_commitish || 'main' }}

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app (without updater signing)
        run: pnpm tauri build ${{ matrix.args }}
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-${{ matrix.arch }}
          path: |
            src-tauri/target/*/release/bundle/macos/*.app
          retention-days: 1

      - name: Upload tar.gz for updater signing
        uses: actions/upload-artifact@v4
        with:
          name: updater-unsigned-${{ matrix.arch }}
          path: |
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz
          retention-days: 1

  # Sign updater artifacts with Tauri key
  sign-updater:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: 'aarch64'
          - arch: 'x64'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download unsigned tar.gz
        uses: actions/download-artifact@v4
        with:
          name: updater-unsigned-${{ matrix.arch }}
          path: updater

      - name: Sign updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          TAR_GZ=$(find updater -name "*.app.tar.gz" | head -1)
          echo "Signing: $TAR_GZ"
          npx --yes @tauri-apps/cli@latest signer sign "$TAR_GZ" --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          ls -la updater/

      - name: Upload updater artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAR_GZ=$(find updater -name "*.app.tar.gz" | head -1)
          SIG=$(find updater -name "*.app.tar.gz.sig" | head -1)

          if [ -n "$TAR_GZ" ]; then
            cp "$TAR_GZ" "ovim_${{ matrix.arch }}.app.tar.gz"
            gh release upload "${{ env.RELEASE_TAG }}" "ovim_${{ matrix.arch }}.app.tar.gz" --clobber --repo "${{ github.repository }}"
          fi

          if [ -n "$SIG" ]; then
            cp "$SIG" "ovim_${{ matrix.arch }}.app.tar.gz.sig"
            gh release upload "${{ env.RELEASE_TAG }}" "ovim_${{ matrix.arch }}.app.tar.gz.sig" --clobber --repo "${{ github.repository }}"
          fi

  # Sign and notarize the app
  sign:
    needs: build
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: 'aarch64'
            target: 'aarch64-apple-darwin'
          - arch: 'x64'
            target: 'x86_64-apple-darwin'

    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download unsigned app bundle
        uses: actions/download-artifact@v4
        with:
          name: app-bundle-${{ matrix.arch }}
          path: bundle

      - name: Find app bundle
        id: find-app
        run: |
          APP_PATH=$(find bundle -name "*.app" -type d | head -1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found app at: $APP_PATH"

      - name: Fix executable permissions
        run: |
          chmod +x "${{ steps.find-app.outputs.app_path }}/Contents/MacOS/"*

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: List signing identities
        run: |
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning
          echo ""
          echo "=== Looking for identity: ${{ secrets.APPLE_SIGNING_IDENTITY }} ==="

      - name: Sign the app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          echo "Signing app at: ${{ steps.find-app.outputs.app_path }}"
          codesign --deep --force --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "${{ steps.find-app.outputs.app_path }}"

          echo "Verifying signature..."
          codesign --verify --deep --strict "${{ steps.find-app.outputs.app_path }}"

      - name: Notarize the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create a zip for notarization
          ditto -c -k --keepParent "${{ steps.find-app.outputs.app_path }}" app.zip

          # Submit for notarization
          xcrun notarytool submit app.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple the notarization ticket
          xcrun stapler staple "${{ steps.find-app.outputs.app_path }}"

      - name: Create DMG
        run: |
          # Install create-dmg
          brew install create-dmg

          # Create DMG
          create-dmg \
            --volname "ovim" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 178 \
            --icon "ovim.app" 175 178 \
            "ovim_${{ matrix.arch }}.dmg" \
            "${{ steps.find-app.outputs.app_path }}"

      - name: Sign DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" "ovim_${{ matrix.arch }}.dmg"

      - name: Upload DMG to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" "ovim_${{ matrix.arch }}.dmg" --clobber --repo "${{ github.repository }}"

  # Generate latest.json for updater
  generate-latest-json:
    needs: [sign, sign-updater]
    if: ${{ !cancelled() && (inputs.finalize_only || (needs.sign.result == 'success' && needs.sign-updater.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ovim_*.app.tar.gz.sig' --dir signatures
          test -s signatures/ovim_aarch64.app.tar.gz.sig
          test -s signatures/ovim_x64.app.tar.gz.sig

      - name: Create latest.json
        run: |
          python3 - <<'PYTHON'
          import base64
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          repository = os.environ['GITHUB_REPOSITORY']
          if not tag.startswith('v'):
              raise ValueError('Expected a version tag beginning with v')
          release_url = f'https://github.com/{repository}/releases'
          platforms = {}
          for arch, platform in [('aarch64', 'darwin-aarch64'), ('x64', 'darwin-x86_64')]:
              signature = Path(f'signatures/ovim_{arch}.app.tar.gz.sig').read_text().strip()
              decoded = base64.b64decode(signature, validate=True)
              if not decoded.startswith(b'untrusted comment:'):
                  raise ValueError(f'Invalid updater signature for {arch}')
              platforms[platform] = {
                  'signature': signature,
                  'url': f'{release_url}/download/{tag}/ovim_{arch}.app.tar.gz',
              }
          manifest = {
              'version': tag[1:],
              'notes': f'See release notes at {release_url}/tag/{tag}',
              'pub_date': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': platforms,
          }
          Path('latest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYTHON

      - name: Upload latest.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" latest.json --clobber --repo "${{ github.repository }}"

  # Update Homebrew tap with new SHA256 checksums
  update-homebrew:
    needs: [sign, generate-latest-json]
    if: ${{ !cancelled() && needs.generate-latest-json.result == 'success' && (inputs.finalize_only || needs.sign.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - name: Download exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-assets
          version="${RELEASE_TAG#v}"
          for name in ovim_aarch64.dmg ovim_x64.dmg; do
            gh release download "$RELEASE_TAG" --pattern "$name" --dir release-assets --repo "$GITHUB_REPOSITORY"
            test -s "release-assets/$name"
            case "$name" in
              *.dmg) hdiutil verify "release-assets/$name" ;;
              *.tar.gz) tar -tzf "release-assets/$name" >/dev/null ;;
            esac
          done

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: tonisives/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update tap from verified assets
        run: |
          python3 homebrew-tap/scripts/update_release.py \
            --product ovim --tag "$RELEASE_TAG" \
            --assets release-assets --tap homebrew-tap

      - name: Verify Homebrew entries before publishing
        run: |
          set -euo pipefail
          brew tap tonisives/tap
          if brew help trust >/dev/null 2>&1; then brew trust --tap tonisives/tap; fi
          tap_dir="$(brew --repository tonisives/tap)"
          cp homebrew-tap/Casks/ovim.rb "$tap_dir/Casks/ovim.rb"
          brew style homebrew-tap/Casks/ovim.rb
          brew audit --cask --strict tonisives/tap/ovim
          brew fetch --cask tonisives/tap/ovim

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/ovim.rb
          git diff --staged --quiet || git commit -m "Update ovim to $RELEASE_TAG"
          git push
